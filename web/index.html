<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Watch Your Money — Personal Finance Vault.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="watchh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Browser address bar theme color (Prevents white flash on mobile/desktop browsers) -->
  <meta name="theme-color" content="#121212">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Watch Your Money</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Dark Onyx Reset (Prevents white blink / flash on refresh) ── */
    html, body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Dark Onyx Splash Screen ──────────────────────────────────── */
    #loading_screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #121316;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
      gap: 0;
    }

    /* ── Logo icon with glow pulse ───────────────────────────────── */
    .splash-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .splash-icon-glow {
      position: absolute;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, transparent 70%);
      animation: glowPulse 2s ease-in-out infinite;
    }
    .splash-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.6),
        0 2px 8px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
      animation: iconFadeIn 0.6s ease-out forwards;
      opacity: 0;
    }

    /* ── Brand text ──────────────────────────────────────────────── */
    .splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      animation: fadeSlideUp 0.6s ease-out 0.2s forwards;
      opacity: 0;
    }
    .splash-name {
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }
    .splash-sub {
      color: #52525B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3.5px;
      text-transform: uppercase;
    }

    /* ── Loading dots ────────────────────────────────────────────── */
    .splash-dots {
      display: flex;
      gap: 5px;
      margin-top: 32px;
      animation: fadeSlideUp 0.6s ease-out 0.4s forwards;
      opacity: 0;
    }
    .splash-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #10B981;
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes iconFadeIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Custom Loading Splash Screen rendered before Flutter Engine starts -->
  <div id="loading_screen">
    <div class="splash-icon-wrap">
      <div class="splash-icon-glow"></div>
      <img class="splash-icon" src="icons/Icon-192.png" alt="Watch Your Money" />
    </div>
    <div class="splash-brand">
      <span class="splash-name">watchh</span>
      <span class="splash-sub">your money</span>
    </div>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    // Event listener: Remove loading screen seamlessly once Flutter paints the first frame
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading_screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <!-- Flutter Web Bootstrap Script -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
